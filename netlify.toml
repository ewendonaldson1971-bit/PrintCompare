[build]
  base = "."
  command = "npm --prefix print-compare ci --no-audit --no-fund && npm --prefix print-compare run build"
  publish = "print-compare/dist"

[functions]
  directory = "print-compare/netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
